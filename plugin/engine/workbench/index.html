<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>悟空 · 审阅工作台</title><script src="/theme.js"></script><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">悟</span><div><strong>悟空动画</strong><span>审阅工作台</span></div></div>
    <div class="project-select"><label for="films">当前影片</label><select id="films" aria-label="切换影片"></select></div>
    <div class="theme-switch" role="group" aria-label="主题"><button type="button" data-theme-choice="light">浅色</button><button type="button" data-theme-choice="dark">深色</button></div>
  </header>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div class="statusbar"><span id="connection" role="status">正在连接本机工程…</span><span id="last-sync"></span><nav class="panelbar" aria-label="工作区面板"><button data-panel="files">文件</button><button data-panel="preview" aria-pressed="true">预览</button><button data-panel="notes">意见</button><button data-panel="checks">检查</button><button id="toggle-library">收起文件栏</button><button id="toggle-inspector">收起审阅栏</button><details class="layout-controls"><summary>调整栏宽</summary><label>文件栏宽度<input id="library-width" type="range" min="180" max="340" value="220"></label><label>审阅栏宽度<input id="inspector-width" type="range" min="260" max="460" value="320"></label></details></nav><span id="draft-status" role="status"></span><button id="retry-drafts" hidden>重试保存草稿</button></div>
  <div id="archive-banner" class="statusbar" role="status" hidden>历史档案 · 只读。原文件、意见与签批保留；继续制作请新建项目并复用素材，旧签批不会继承。</div>
  <main class="workspace" data-panel="preview" hidden>
    <aside class="library">
      <div class="section-heading"><span>制作流程</span><span id="progress" class="muted"></span></div>
      <nav id="stages" aria-label="制作阶段"></nav>
      <div class="section-heading file-heading"><span>本阶段交付物</span><span id="file-count" class="muted"></span></div>
      <div id="files" aria-label="交付物列表"></div>
      <div class="library-foot">每一步成果，都有据可查</div>
    </aside>
    <section class="center">
      <div class="viewer-toolbar"><div><span id="stage-name" class="eyebrow">制作审阅</span><h1 id="file-name">选择影片开始审阅</h1></div><div class="viewer-actions"><span id="view-state" class="tag"></span><button id="read-mode" hidden>查看原文</button><select id="shot-jump" aria-label="定位分镜" hidden></select><button id="fullscreen" title="全屏预览" aria-label="全屏预览">⛶</button></div></div>
      <div id="viewer" tabindex="0"><div class="empty"><span class="empty-symbol">◈</span><h2>所有交付物，在这里相遇</h2><p>从左侧选择一个阶段，开始查看和审阅。</p></div></div>
      <div id="timeline" hidden>
        <div class="timeline-head"><strong>播放时间轴</strong><span id="play-time">00:00 / 00:00</span><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="mark-time" class="quiet">标注当前时间</button></div>
        <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置">
        <div class="track-row"><span class="track-label">镜头</span><div id="shot-track"></div></div>
        <div class="timeline-note">点击镜头，按这一段的起止时间定位。</div>
      </div>
      <footer class="viewer-foot"><span id="file-path">本地素材 · 只读预览</span><button id="locate" class="quiet">定位原文件 ↗</button></footer>
    </section>
    <aside class="inspector">
      <div class="inspector-scroll">
        <section class="inspector-section checks-section"><div class="section-heading"><span>版本与检查</span><span id="kind-label" class="muted"></span></div><label class="field-label" for="versions">查看版本</label><select id="versions"></select><div id="version-detail" class="meta"></div><div id="checks"></div></section>
        <section class="inspector-section notes-section"><div class="section-heading"><span>批注</span><span id="note-count" class="muted"></span></div><div id="batch"></div>
          <form id="note-form"><div class="anchor-row"><span id="anchor-label">整份交付物</span><button id="clear-anchor" type="button" class="quiet">清除定位</button></div>
            <div id="time-anchor" hidden><label>起点<input id="time-start" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="起点"></label><label>终点<input id="time-end" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="终点"></label></div>
            <textarea id="note-text" rows="3" maxlength="10000" placeholder="写下这一条批注…" aria-label="批注"></textarea>
            <div class="note-options"><button type="button" id="add-note">加入这一条</button><button type="submit" class="primary">发送到对话</button></div>
          </form><p class="hint">选中文字、点击图片，或标记播放时间来定位。一条可以直接发送；多条先加入，再发送勾选的批注。</p>
        </section>
      </div>
    </aside>
  </main>
</body></html>
