name: smoke
on:
  push:
    # 只改文档的提交不影响渲染，不必跑浏览器（lint 仍会检查文档）
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
    inputs:
      update:
        description: 重新生成 linux 基准图（结果作为 artifact 上传，下载后提交到 tests/smoke/baseline/linux/）
        type: boolean
        default: false
# 同一分支连推几次时，只跑最新的那次
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    # 正常 1–2 分钟跑完；默认上限是 6 小时，卡住时会一直占着
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/engine/package-lock.json
      # 每次都要从 Ubuntu 镜像下 150 MB 安装包（ffmpeg + 中文字体 124 MB、Chromium 系统依赖 26 MB），
      # 镜像偶尔慢到几分钟都下不完。把下载好的 .deb 缓存起来：之后从缓存装，只联网更新软件源索引（十几 MB）。
      - name: 恢复 apt 安装包缓存
        id: apt-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-deps-
          restore-keys: apt-${{ runner.os }}-deps-
      - name: 让所有 apt 调用都用缓存目录
        run: |
          mkdir -p ~/apt-archives/partial
          # 写成全局配置：Playwright 安装 Chromium 依赖时内部调用的 apt-get 也会用上
          sudo tee /etc/apt/apt.conf.d/99wka-cache > /dev/null <<EOF
          Dir::Cache::Archives "$HOME/apt-archives";
          APT::Keep-Downloaded-Packages "true";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          EOF
      - name: 安装 ffmpeg 与中文字体
        timeout-minutes: 10
        run: |
          sudo apt-get update
          # 缓存没命中又碰上镜像慢：单次最多 4 分钟，超时再试一次（已下好的包留在缓存目录里，不会重下）
          for i in 1 2; do sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk && break; done
          ffmpeg -version > /dev/null
      - name: 安装 npm 依赖
        run: npm run setup
      - name: 缓存 Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # playwright 已锁定版本，package-lock 变了才会换浏览器
          key: playwright-${{ runner.os }}-${{ hashFiles('plugin/engine/package-lock.json') }}
      - name: 安装 Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: plugin/engine
        run: for i in 1 2; do timeout 210 npx playwright install --with-deps chromium && break; done
      - name: 安装 Chromium 系统依赖
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        working-directory: plugin/engine
        run: for i in 1 2; do timeout 140 npx playwright install-deps chromium && break; done
      - name: 整理 apt 安装包缓存
        id: apt
        run: |
          # 去掉镜像上已经没有的旧版本包，缓存不会越攒越大
          sudo apt-get autoclean
          sudo chown -R "$USER" ~/apt-archives
          echo "hash=$(ls ~/apt-archives/*.deb | xargs -n1 basename | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # 包有变化（首次运行、Ubuntu 更新了版本）才另存一份新缓存
      - name: 保存 apt 安装包缓存
        if: steps.apt-restore.outputs.cache-matched-key != format('apt-{0}-deps-{1}', runner.os, steps.apt.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-deps-${{ steps.apt.outputs.hash }}
      - name: 单元与集成测试
        timeout-minutes: 5
        run: npm test
      - name: 冒烟测试（确定性 + 基准图比对）
        timeout-minutes: 5
        run: npm run smoke -- ${{ inputs.update && '--update' || '' }}
      - name: 上传 linux 基准图
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-baseline-linux
          path: tests/smoke/baseline/linux/
