name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 结构与清单校验
        run: node tools/lint.mjs
      - name: 工具包文档是否最新
        run: node tools/build-docs.mjs --check
