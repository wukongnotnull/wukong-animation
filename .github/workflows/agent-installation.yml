name: agent-installation
on: [push, workflow_dispatch, workflow_call]
concurrency:
  group: agent-installation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装仓库开发检查依赖
        run: npm ci --no-audit --no-fund
      - name: 验证命令生命周期、兼容契约与架构约束
        run: node --test tests/unit/cli-lifecycle.test.mjs tests/unit/cli-contracts.test.mjs tests/unit/module-boundaries.test.mjs tests/unit/merge-gate.test.mjs tests/unit/installation-diagnostics.test.mjs tests/integration/upgrade-diagnostics.test.mjs
      - run: node --test tests/integration/portable-installation.test.mjs
      - name: Verify bounded hashing and source observations
        run: node --test tests/unit/file-hash.test.mjs tests/unit/source-state.test.mjs
      - run: npm run build:portable
      - name: Verify ZIP transport
        shell: bash
        run: |
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.zip')[0]); assert z.testzip() is None; z.extractall('dist/extracted')"
          node dist/extracted/install-agent.mjs list --json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-skills-${{ runner.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
