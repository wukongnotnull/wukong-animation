name: smoke
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: 重新生成 linux 基准图（结果作为 artifact 上传，下载后提交到 tests/smoke/baseline/linux/）
        type: boolean
        default: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 ffmpeg 与中文字体
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: 安装渲染依赖
        run: |
          cd plugin/engine
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 单元与集成测试
        run: node --test tests/unit/*.test.mjs tests/integration/*.test.mjs
      - name: 冒烟测试（确定性 + 基准图比对）
        run: node tests/smoke/run.mjs ${{ inputs.update && '--update' || '' }}
      - name: 上传 linux 基准图
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-baseline-linux
          path: tests/smoke/baseline/linux/
