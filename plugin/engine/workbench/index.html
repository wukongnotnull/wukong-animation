<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>悟空 · 审阅工作台</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">悟</span><div><strong>悟空动画</strong><span>审阅工作台</span></div></div>
    <div class="project-select"><label for="films">当前影片</label><select id="films" aria-label="切换影片"></select></div>
    <span class="local-badge"><i></i> 本地工作台</span>
    <button id="refresh" class="quiet">↻ 刷新交付物</button><button id="pending" class="quiet">查看返修待办</button>
  </header>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <main class="workspace">
    <aside class="library">
      <div class="section-heading"><span>制作流程</span><span id="progress" class="muted"></span></div>
      <nav id="stages" aria-label="制作阶段"></nav>
      <div class="section-heading file-heading"><span>本阶段交付物</span><span id="file-count" class="muted"></span></div>
      <div id="files" aria-label="交付物列表"></div>
      <div class="library-foot">每一步成果，都有据可查</div>
    </aside>
    <section class="center">
      <div class="viewer-toolbar"><div><span id="stage-name" class="eyebrow">制作审阅</span><h1 id="file-name">选择影片开始审阅</h1></div><div class="viewer-actions"><span id="view-state" class="tag"></span><button id="fullscreen" title="全屏预览" aria-label="全屏预览">⛶</button></div></div>
      <div id="viewer" tabindex="0"><div class="empty"><span class="empty-symbol">◈</span><h2>所有交付物，在这里相遇</h2><p>从左侧选择一个阶段，开始查看和审阅。</p></div></div>
      <div id="timeline" hidden>
        <div class="timeline-head"><strong>播放时间轴</strong><span id="play-time">00:00 / 00:00</span><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="mark-time" class="quiet">标注当前时间</button></div>
        <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置">
        <div class="track-row"><span class="track-label">镜头</span><div id="shot-track"></div></div>
        <div class="timeline-note">点击镜头定位 · 时间轴仅用于查看</div>
      </div>
      <footer class="viewer-foot"><span id="file-path">本地素材 · 只读预览</span><button id="locate" class="quiet">定位原文件 ↗</button></footer>
    </section>
    <aside class="inspector">
      <div class="inspector-scroll">
        <section class="inspector-section"><div class="section-heading"><span>版本与检查</span><span id="kind-label" class="muted"></span></div><label class="field-label" for="versions">查看版本</label><select id="versions"></select><div id="version-detail" class="meta"></div><div id="checks"></div><button id="checked" class="wide">✓ 已检查当前版本</button></section>
        <section class="inspector-section"><div class="section-heading"><span>审阅意见</span><span id="note-count" class="muted"></span></div><div id="notes"></div>
          <form id="note-form"><div class="anchor-row"><span id="anchor-label">整份交付物</span><button id="clear-anchor" type="button" class="quiet">清除定位</button></div>
            <div id="time-anchor" hidden><label>起点（秒）<input id="time-start" type="number" min="0" step="0.01"></label><label>终点（秒）<input id="time-end" type="number" min="0" step="0.01"></label></div>
            <textarea id="note-text" rows="3" maxlength="10000" placeholder="写下具体意见…" aria-label="审阅意见" required></textarea>
            <div class="note-options"><label><input id="blocking" type="checkbox" checked> 通过前必须解决</label><button type="submit" class="primary">保存意见</button></div>
          </form><p class="hint">选中文字、点击图片，或标记播放时间，即可定位问题。保存意见后，回到对话说“处理工作台里的待办”。</p>
        </section>
        <section class="inspector-section"><div class="section-heading"><span>阶段审阅</span><span id="stage-status" class="tag"></span></div><div id="stage-blocks"></div><textarea id="decision-note" rows="2" maxlength="10000" placeholder="本阶段的审阅结论" aria-label="阶段审阅结论"></textarea><label id="draft-confirm" hidden><input id="draft-opened" type="checkbox"> 我已在专用软件中打开并检查当前草稿</label><div class="decision-actions"><button id="request-changes">需要修改</button><button id="approve" class="primary">通过本阶段</button></div><p class="hint">通过绑定当前版本；返修由对话发起。</p><details><summary>历史审阅结论</summary><div id="decision-history"></div></details></section>
      </div>
    </aside>
  </main>
  <dialog id="pending-dialog"><div class="dialog-head"><h2>返修待办</h2><button id="close-pending" aria-label="关闭待办">×</button></div><p class="hint">回到对话说“处理工作台里的待办”，插件会读取这些意见。此页面不会启动生成。</p><div id="pending-list"></div></dialog>
</body></html>
