<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 字幕层宿主页模板：subtitle-layer.mjs 把 {{...}} 替换掉后写入 .cache/work/subtitle.html，逐条截成透明 PNG。
     不放在 runtime/：那里的文件都算进镜头哈希 -->
<style>
{{FONT_CSS}}
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
#frame{position:relative;overflow:hidden}
#block{position:absolute;left:0;right:0;text-align:center}
.line{line-height:1.3;white-space:pre;paint-order:stroke fill}
.line span{display:inline-block}
</style>
<script>window.__SUB = {{CONFIG}};</script>
</head>
<body>
<!-- 双语时英文行在样式的 bottom 处，中文行在它正上方；单语时只有中文行 -->
<div id="frame"><div id="block"><div class="line" id="line"><span id="text"></span></div><div class="line" id="line-en"><span id="text-en"></span></div></div></div>
<script>
(() => {
  const c = window.__SUB;
  const frame = document.getElementById('frame');
  const block = document.getElementById('block');
  const lines = { zh: [document.getElementById('line'), document.getElementById('text'), c.family], en: [document.getElementById('line-en'), document.getElementById('text-en'), c.familyEn] };
  Object.assign(frame.style, { width: c.W + 'px', height: c.H + 'px' });
  Object.assign(block.style, { bottom: c.bottom + 'px', color: c.color });
  if(c.safeArea) Object.assign(block.style,{left:c.safeArea.x+'px',right:(c.W-c.safeArea.x-c.safeArea.w)+'px'});
  let loaded=true;
  /** 摆好一行；整行放不下就缩小字号，返回实际字号。 */
  const fit = async ([line, text, family], s) => {
    let size = c.size;
    line.style.fontFamily = family;
    text.textContent = s;
    for (;;) {
      line.style.fontSize = size + 'px';
      line.style.webkitTextStroke = `${size * c.strokeWidth * 2}px ${c.strokeColor}`;
      await document.fonts.load(`${size}px ${family}`, s).catch(() => {loaded=false;});
      await document.fonts.ready;
      if (text.offsetWidth <= c.maxWidth || size <= 8) return size;
      size -= 1;
    }
  };
  /** 摆好一条字幕（en 为空时只有中文行），返回两行各自的实际字号。 */
  window.setSubtitle = async (s, en) => {
    lines.en[0].style.display = en ? '' : 'none';
    loaded=true;
    const zh=await fit(lines.zh,s), english=en?await fit(lines.en,en):null;
    const rects=Object.entries(lines).filter(([lang])=>lang==='zh' || en).map(([lang,[line,text]])=>{
      const r=text.getBoundingClientRect(),stroke=parseFloat(line.style.fontSize)*c.strokeWidth;
      return {lang,x:r.x-stroke,y:r.y-stroke,w:r.width+2*stroke,h:r.height+2*stroke};
    });
    return {zh,en:english,rects,loaded};
  };
})();
</script>
</body>
</html>
