name: lint
on: [push, pull_request]
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装仓库开发检查依赖
        run: npm ci --no-audit --no-fund
      - name: 结构与清单校验、工具包文档是否最新
        run: npm run lint
